name: APK bauen

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: APK bauen
        run: gradle assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk MeineAufgaben.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MeineAufgaben-apk
          path: MeineAufgaben.apk

      - name: Als Release veröffentlichen (Download direkt aufs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: Meine Aufgaben (${{ github.ref_name }})
          prerelease: true
          files: MeineAufgaben.apk
